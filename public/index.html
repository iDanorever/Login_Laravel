<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Login Laravel - TechAuth</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
    <style>
        @layer base {
            html, body { margin:0; padding:0; }
            body { overscroll-behavior:none; }
        }
        ::-webkit-scrollbar { display:none; }
    </style>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
    tailwind.config = { 
      darkMode: "class", 
      theme: { 
        extend: { 
          colors: { 
            brand: {
              red: "#FF2D20",
              'red-hover': "#e0261a",
              'red-glow': "rgba(255, 45, 32, 0.4)",
              mysql: "#00758F",
              'mysql-bright': "#00a4cc",
              'mysql-glow': "rgba(0, 164, 204, 0.35)",
            },
            slate: {
              950: "#0D1117",
              900: "#161B22",
              850: "#1c2128",
              800: "#21262D",
              700: "#30363D",
              600: "#484F58",
              500: "#6E7681",
              400: "#8B949E",
              300: "#C9D1D9",
              200: "#E6EDF3",
              100: "#F0F6FC"
            }
          }, 
          fontFamily: { 
            'headline-md': [ 'Plus Jakarta Sans', 'sans-serif' ], 
            'body-md': [ 'Inter', 'sans-serif' ], 
            'body-sm': [ 'Inter', 'sans-serif' ],
            'code-sm': [ 'JetBrains Mono', 'monospace' ]
          } 
        } 
      } 
    }
    </script>
</head>
<body class="bg-slate-950 text-slate-200 antialiased min-h-screen flex items-center justify-center relative overflow-hidden p-4 selection:bg-brand-red selection:text-white">

    <!-- Orbes Decorativas Ambientales -->
    <div class="absolute -top-24 -left-20 w-[420px] h-[420px] bg-brand-red/15 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="absolute top-1/4 -right-20 w-[440px] h-[440px] bg-brand-mysql/20 rounded-full blur-[110px] pointer-events-none"></div>
    <div class="absolute -bottom-24 left-1/3 w-[380px] h-[380px] bg-brand-mysql-bright/10 rounded-full blur-[100px] pointer-events-none"></div>

    <!-- Contenedor Principal Centrado -->
    <div class="max-w-md w-full relative z-10">
        <div class="w-full p-8 rounded-lg bg-slate-900 border border-slate-700 shadow-[0_16px_40px_-8px_rgba(0,0,0,0.85),0_0_30px_rgba(255,45,32,0.08),0_0_30px_rgba(0,164,204,0.06)] relative backdrop-blur-sm" id="card-container">
            
            <!-- Borde Superior en Gradiente Dual -->
            <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-brand-red to-brand-mysql-bright"></div>

            <!-- Header con Icono Resplandeciente -->
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-lg bg-slate-950 border border-slate-700 mb-4 shadow-[0_0_20px_rgba(255,45,32,0.2)] relative group">
                    <div class="absolute inset-0 bg-gradient-to-br from-brand-red/20 to-brand-mysql/20 rounded-lg"></div>
                    <span class="material-symbols-outlined text-brand-red text-[28px] relative z-10" style="font-variation-settings: 'FILL' 1;">terminal</span>
                </div>
                <h1 class="font-headline-md text-2xl font-bold text-white tracking-tight mb-1.5">Laravel Login</h1>
                <p class="font-body-md text-sm text-slate-400">Autentícate para acceder al sistema</p>
            </div>

            <!-- Banner de Alerta (Error o Éxito) -->
            <div class="hidden mb-4 p-3 rounded-lg font-body-sm text-xs flex items-center gap-2.5 transition-all" id="login-alert">
                <span class="material-symbols-outlined text-[18px]" id="login-alert-icon">error</span>
                <span id="login-alert-text">Error de autenticación</span>
            </div>

            <!-- Formulario de Login -->
            <form class="flex flex-col gap-4" id="login-form">
                <div class="flex flex-col gap-1.5">
                    <label class="font-body-sm text-xs font-medium text-slate-300" for="email">Correo Electrónico</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-3.5 material-symbols-outlined text-slate-500 text-[19px] pointer-events-none">mail</span>
                        <input autocomplete="email" class="w-full pl-11 pr-10 py-3 rounded-lg bg-slate-950 border border-slate-700 text-slate-100 font-body-md text-sm placeholder:text-slate-500 focus:outline-none focus:border-brand-red focus:ring-1 focus:ring-brand-red focus:shadow-[0_0_16px_rgba(255,45,32,0.3)] transition-all" id="email" name="email" placeholder="omar@gmail.com" required type="email"/>
                    </div>
                </div>

                <div class="flex flex-col gap-1.5">
                    <div class="flex items-center justify-between">
                        <label class="font-body-sm text-xs font-medium text-slate-300" for="password">Contraseña</label>
                        <a class="font-body-sm text-xs font-medium text-brand-mysql-bright hover:text-brand-red transition-colors" href="recuperar.html">Forgot password?</a>
                    </div>
                    <div class="relative flex items-center">
                        <span class="absolute left-3.5 material-symbols-outlined text-slate-500 text-[19px] pointer-events-none">lock</span>
                        <input class="w-full pl-11 pr-11 py-3 rounded-lg bg-slate-950 border border-slate-700 text-slate-100 font-body-md text-sm placeholder:text-slate-500 focus:outline-none focus:border-brand-red focus:ring-1 focus:ring-brand-red focus:shadow-[0_0_16px_rgba(255,45,32,0.3)] transition-all" id="password" name="password" placeholder="••••••••••••" required type="password"/>
                        <button class="absolute right-2.5 p-1.5 rounded text-slate-400 hover:text-brand-red transition-colors focus:outline-none" id="toggle-password" type="button">
                            <span class="material-symbols-outlined text-[19px] block" id="toggle-icon">visibility</span>
                        </button>
                    </div>
                </div>

                <button class="relative w-full mt-2 py-3.5 px-4 rounded-lg bg-brand-red hover:bg-brand-red-hover text-white font-headline-md text-sm font-bold tracking-wide shadow-[0_4px_20px_rgba(255,45,32,0.4)] hover:shadow-[0_4px_28px_rgba(255,45,32,0.65)] transition-all flex items-center justify-center gap-2 border border-red-500/30 active:scale-[0.99]" id="login-btn" type="submit">
                    <span class="flex items-center gap-2 font-semibold" id="btn-text">
                        <span>Authenticate Session</span>
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                    </span>
                </button>
            </form>

            <!-- Botón Passkey -->
            <div class="mt-4 pt-3 flex flex-col items-center">
                <button class="w-full py-2.5 px-4 rounded-lg bg-slate-950/80 hover:bg-slate-800/90 border border-slate-700/80 hover:border-brand-mysql/60 text-slate-200 font-body-sm text-xs font-medium flex items-center justify-center gap-2 transition-all group shadow-sm hover:shadow-[0_0_14px_rgba(0,164,204,0.2)]" id="btn-code-login" type="button">
                    <span class="material-symbols-outlined text-brand-mysql-bright group-hover:scale-110 text-[18px] transition-transform">key</span>
                    <span class="group-hover:text-brand-mysql-bright transition-colors">Sign in with Hardware Key / Passkey</span>
                </button>
            </div>

            <!-- Footer interno -->
            <div class="mt-6 text-center font-body-sm text-xs text-slate-400">
                <span>¿No tienes cuenta registrada?</span>
                <a class="text-brand-red hover:text-white font-semibold ml-1 inline-flex items-center gap-0.5 transition-colors" href="registrar.html">
                    <span>Regístrate aquí</span>
                    <span class="material-symbols-outlined text-[14px]">chevron_right</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Modal Decorada de Código/Passkey -->
    <div class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4" id="code-modal">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-lg max-w-sm w-full relative shadow-[0_16px_40px_-8px_rgba(0,0,0,0.85),0_0_30px_rgba(0,164,204,0.15)]">
            <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-brand-mysql to-brand-mysql-bright"></div>
            
            <div class="flex items-center gap-2 mb-3">
                <span class="material-symbols-outlined text-brand-mysql-bright text-[22px]">key</span>
                <h3 class="text-base font-bold text-white">Acceso por Código / Passkey</h3>
            </div>
            
            <p class="text-xs text-slate-400 mb-4 font-body-sm">Ingresa tu código único de respaldo generado durante el registro.</p>
            
            <input class="w-full py-3 px-3 rounded-lg bg-slate-950 border border-slate-700 text-brand-mysql-bright text-center tracking-widest uppercase font-code-sm text-sm font-bold mb-4 focus:border-brand-mysql-bright focus:ring-1 focus:ring-brand-mysql-bright focus:outline-none" id="passkey-input" placeholder="X8A92M10" type="text"/>
            
            <div class="flex gap-2">
                <button class="w-1/2 py-2.5 bg-slate-800 text-slate-300 rounded-lg text-xs font-semibold hover:bg-slate-700 transition-colors" id="close-modal" type="button">Cancelar</button>
                <button class="w-1/2 py-2.5 bg-brand-mysql hover:bg-brand-mysql-bright text-white rounded-lg text-xs font-bold transition-all shadow-[0_0_12px_rgba(0,164,204,0.3)]" id="submit-passkey" type="button">Validar Código</button>
            </div>
        </div>
    </div>

<script>
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const toggleIcon = document.getElementById('toggle-icon');
    const btnCodeLogin = document.getElementById('btn-code-login');
    const codeModal = document.getElementById('code-modal');
    const closeModal = document.getElementById('close-modal');
    const submitPasskey = document.getElementById('submit-passkey');
    const alertBox = document.getElementById('login-alert');
    const alertIcon = document.getElementById('login-alert-icon');
    const alertText = document.getElementById('login-alert-text');

    // Ojito para visibilidad de contraseña
    togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });

    // Control de modal Passkey
    btnCodeLogin.addEventListener('click', () => codeModal.classList.remove('hidden'));
    closeModal.addEventListener('click', () => codeModal.classList.add('hidden'));

    // Funciones de Alerta (Error / Éxito)
    function showError(msg) {
        alertBox.className = 'mb-4 p-3.5 rounded-lg font-body-sm text-xs flex items-center gap-2.5 bg-red-950/80 border border-brand-red/50 text-red-200';
        alertIcon.textContent = 'error';
        alertText.textContent = msg;
        alertBox.classList.remove('hidden');
    }

    function showSuccess(msg) {
        alertBox.className = 'mb-4 p-3.5 rounded-lg font-body-sm text-xs flex items-center gap-2.5 bg-emerald-950/80 border border-emerald-500/50 text-emerald-200';
        alertIcon.textContent = 'mark_email_read';
        alertText.textContent = msg;
        alertBox.classList.remove('hidden');
    }

    // Detectar si regresa desde la pantalla de recuperación
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get('status');
        const email = urlParams.get('email');

        if (status === 'sent') {
            showSuccess(`Te hemos enviado las instrucciones de recuperación a ${email || 'tu correo'}. Revisa tu bandeja de entrada o spam en Gmail.`);
            window.history.replaceState({}, document.title, window.location.pathname);
        } else if (status === 'updated') {
            showSuccess('¡Contraseña actualizada exitosamente! Ya puedes iniciar sesión con tu nueva clave.');
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    });

    // Submit de Login Normal
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const correo = document.getElementById('email').value.trim();
        const passwordd = document.getElementById('password').value;

        alertBox.classList.add('hidden');

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo, passwordd })
            });
            const data = await res.json();
            
            if(data.success) {
                document.getElementById('card-container').innerHTML = `
                    <div class="text-center py-6">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-emerald-500/20 text-emerald-400 mb-4 border border-emerald-500/40">
                            <span class="material-symbols-outlined text-[36px]">check_circle</span>
                        </div>
                        <h2 class="font-headline-md text-2xl font-bold text-white mb-2">¡LOGIN EXITOSO! ✅</h2>
                        <p class="text-slate-300 mb-1">Bienvenido(a): <strong>${data.data.Nombres} ${data.data.Apellidos || ''}</strong></p>
                        <p class="text-xs font-code-sm text-slate-400 mb-6">DNI: ${data.data.Dni || 'N/A'} | Correo: ${data.data.Correo}</p>
                        <button onclick="location.reload()" class="w-full py-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-semibold text-sm border border-slate-600 transition-all">
                            Cerrar Sesión
                        </button>
                    </div>
                `;
            } else {
                showError(data.message || 'Credenciales incorrectas');
            }
        } catch(err) {
            showError('Error al conectar con la API');
        }
    });

    // Submit de Login por Código Passkey
    submitPasskey.addEventListener('click', async () => {
        const codigo = document.getElementById('passkey-input').value.trim();
        if(!codigo) return;

        try {
            const res = await fetch('/api/login-codigo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ codigo })
            });
            const data = await res.json();

            if(data.success) {
                codeModal.classList.add('hidden');
                document.getElementById('card-container').innerHTML = `
                    <div class="text-center py-6">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-brand-mysql/20 text-brand-mysql-bright mb-4 border border-brand-mysql/40">
                            <span class="material-symbols-outlined text-[36px]">key</span>
                        </div>
                        <h2 class="font-headline-md text-2xl font-bold text-white mb-2">ACCESO POR PASSKEY ✅</h2>
                        <p class="text-slate-300 mb-1">Bienvenido(a): <strong>${data.data.Nombres} ${data.data.Apellidos || ''}</strong></p>
                        <p class="text-xs font-code-sm text-slate-400 mb-6">DNI: ${data.data.Dni || 'N/A'} | Correo: ${data.data.Correo}</p>
                        <button onclick="location.reload()" class="w-full py-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-semibold text-sm border border-slate-600 transition-all">
                            Cerrar Sesión
                        </button>
                    </div>
                `;
            } else {
                alert(data.message || 'Código inválido');
            }
        } catch(err) {
            alert('Error al validar código');
        }
    });
</script>
</body>
</html>
